<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buku Panduan Operasional ADTIA 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f1fb;--bar:#ffffff;--ink:#14305c;--muted:#5b6f8f;--line:#cfdcee;--g:#2f9e49;--o:#f58a1f;--b:#1a5bb8;--n:#0b2f6b;--paper:#fff;--ptext:#26364f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1628;--bar:#12233f;--ink:#e6eefb;--muted:#9bb0d0;--line:#27406b}}
:root[data-theme="dark"]{--bg:#0a1628;--bar:#12233f;--ink:#e6eefb;--muted:#9bb0d0;--line:#27406b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--bar);border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
header b{font-weight:800}
header button{font:inherit}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bar);color:var(--ink);font-size:22px;cursor:pointer;flex:none}
.nav:disabled{opacity:.3;cursor:default}
.nav:focus-visible,.toc a:focus-visible,.dots button:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.book{position:relative;height:100%;max-height:760px;aspect-ratio:3/4.1;max-width:100%;perspective:2200px}
.pg{position:absolute;inset:0;background:var(--paper);color:var(--ptext);border-radius:4px 14px 14px 4px;box-shadow:0 10px 30px rgba(10,40,90,.28),inset 6px 0 10px -6px rgba(0,0,0,.25);transform-origin:left center;transition:transform .8s cubic-bezier(.5,.1,.2,1),opacity .4s .3s;backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column}
.pg.gone{transform:rotateY(-105deg);opacity:0;pointer-events:none}
.pg.after{pointer-events:none}
.in{flex:1;overflow:auto;padding:5% 7% 8%;font-size:clamp(11px,1.55vh,14px);line-height:1.5}
.num{position:absolute;bottom:10px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--n);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.cover{background:var(--n) center/cover no-repeat}
.band{display:flex;align-items:center;gap:10px;color:#fff;border-radius:30px 10px 10px 30px;padding:6px 14px 6px 6px;margin:0 -7% 14px -7%;font-weight:800;font-size:1.25em}
.band i{font-style:normal;width:2.1em;height:2.1em;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.1em}
.c1{background:var(--b)}.c1 i{color:var(--b)}.c2{background:var(--o)}.c2 i{color:var(--o)}.c3{background:var(--g)}.c3 i{color:var(--g)}.c4{background:var(--n)}.c4 i{color:var(--n)}.c5{background:var(--o)}.c5 i{color:var(--o)}
.band small{display:block;font-weight:600;font-size:.7em;opacity:.9}
h3{margin:1.1em 0 .4em;font-size:1.1em;color:var(--b);font-weight:800}
.pg ul{margin:.3em 0;padding-left:1.2em}.pg li{margin:.25em 0}
.ok li::marker{color:var(--g);content:"✓  "}
.q{margin-top:1.6em;text-align:center;font-style:italic;color:var(--b);font-weight:600}
.warn{border:2px solid var(--o);background:#fff4e6;border-radius:10px;padding:.7em .9em;margin-top:1em;color:#5a3200}
.warn b{color:#c25e00}
.tag{display:inline-block;border-radius:20px;padding:.1em .8em;color:#fff;font-weight:700;font-size:.9em}
table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:.95em}
th{background:var(--n);color:#fff;text-align:left}
th,td{padding:.35em .6em;border-bottom:1px solid #d7e1ef}td:last-child,th:last-child{text-align:right}
td:first-child,th:first-child{text-align:center;width:2.4em}
.toc{list-style:none;padding:0!important}
.toc li{margin:.9em 0}
.toc a{color:var(--n);font-weight:800;text-decoration:none;display:flex;align-items:center;gap:.6em}
.toc a span{width:1.9em;height:1.9em;border-radius:50%;color:#fff;display:grid;place-items:center;flex:none}
.toc small{display:block;margin:.1em 0 0 2.6em;color:#5b6f8f;font-size:.9em}
ol.s{padding-left:1.4em}
.end{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:1em}
.end h2{color:var(--n);margin:0}
.trio{display:flex;gap:14px;font-weight:800}
.trio span{padding:.5em 1em;border-radius:30px;color:#fff}
footer{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 12px 12px;background:var(--bar);border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.dots{display:flex;gap:6px}.dots button{width:10px;height:10px;border-radius:50%;border:0;background:var(--line);padding:0;cursor:pointer}.dots button[aria-current=true]{background:var(--o);width:24px;border-radius:6px}
@media (max-width:640px){.nav{position:fixed;bottom:56px;z-index:5;width:40px;height:40px;opacity:.9}#prev{left:8px}#next{right:8px}main{padding:8px}}
@media (prefers-reduced-motion:reduce){.pg{transition:opacity .2s}.pg.gone{transform:none}}
</style>
</head>

{t:"Pendahuluan",c:"c1",i:"1",n:"Pendahuluan",b:
'<h3>1.1 Latar Belakang</h3><p>Al Madinah Digital Teacher Innovation Award (ADTIA) 2026 adalah ajang kompetisi inovasi bagi guru mata pelajaran di lingkungan SMPIT Al Madinah Tanjungpinang untuk mendorong lahirnya karya inovatif yang memanfaatkan teknologi dan kecerdasan buatan (AI) dalam pembelajaran.</p>'+
'<h3>1.2 Tujuan Panduan</h3><ul class="ok"><li>Memberikan petunjuk lengkap bagi seluruh pengguna (peserta, panitia, dewan juri, dan ketua pelaksana).</li><li>Memastikan proses pendaftaran, pengumpulan berkas, verifikasi, penilaian, dan finalisasi berjalan dengan lancar.</li><li>Mengurangi kendala teknis dan meminimalkan kesalahan pengisian data.</li></ul>'+
'<h3>1.3 Ketentuan Umum</h3><ul><li>Peserta adalah guru aktif SMPIT Al Madinah Tanjungpinang.</li><li>Tim terdiri dari maksimal 3 orang (1 Ketua dan hingga 2 Anggota).</li><li>Semua anggota dalam satu tim wajib mengampu mata pelajaran yang sama.</li></ul>'+
'<p class="q">“Inovasi kecil dari guru, bisa menjadi perubahan besar bagi murid.”</p>'},
{t:"Panduan Peserta",c:"c2",i:"2",n:"Panduan Peserta Lomba<small>Guru Mata Pelajaran</small>",b:
'<h3>2.1 Persyaratan Tim</h3><ul class="ok"><li>Terdiri dari guru aktif SMPIT Al Madinah Tanjungpinang.</li><li>Tim beranggotakan maksimal 3 orang (1 Ketua dan hingga 2 Anggota).</li><li><b>Ketentuan mutlak:</b> semua anggota dalam satu tim wajib mengampu mata pelajaran yang sama.</li></ul>'+
'<h3>2.2 Alur Pendaftaran Tim Baru</h3><ol class="s"><li>Buka tautan resmi lomba.</li><li>Klik tombol <b>Daftar Lomba</b> pada navigasi atas atau halaman beranda.</li><li>Isi data formulir:<ul><li><b>Identitas Tim:</b> nama tim, mata pelajaran, dan pilih salah satu kategori.</li><li><b>Ketua Tim:</b> nama lengkap, NIP/NUPTK, email aktif, WhatsApp.</li><li><b>Anggota (opsional):</b> nama, NIY, dan mata pelajaran (harus sama).</li><li><b>Rencana Inovasi:</b> judul, rumusan masalah, deskripsi singkat.</li></ul></li><li>Centang persetujuan ketentuan lomba, lalu klik <b>Kirim Pendaftaran</b>.</li><li>Catat dan simpan ID Peserta dan Kode Akses (contoh: ADTIA26-003 / K7X9PQ).</li><li>Login ke Portal Peserta.</li></ol>'+
'<div class="warn"><b>⚠ Penting!</b> Catat dan simpan ID Peserta dan Kode Akses yang muncul di layar. Kredensial ini digunakan untuk masuk ke Portal Peserta.</div>'},
{t:"Panduan Panitia",c:"c3",i:"3",n:"Panduan Panitia Pelaksana",b:
'<h3>3.1 Akses Portal Panitia</h3><ol class="s"><li>Buka menu <b>Panitia</b> pada bilah navigasi.</li><li>Masukkan PIN Panitia (default demo: 1234), lalu klik <b>Masuk</b>.</li></ol>'+
'<h3>3.2 Memeriksa dan Memverifikasi Berkas Masuk</h3><ol class="s"><li>Periksa tabel <b>Verifikasi Berkas</b>.</li><li>Klik tautan <b>Laporan, Produk, Dok.,</b> atau <b>Video</b> peserta.</li><li>Tentukan status berkas:<br><span class="tag" style="background:var(--g)">Verifikasi (hijau)</span> berkas lengkap dan valid.<br><span class="tag" style="background:#d93636">Perbaikan (merah)</span> tautan terkunci/format salah/dokumen kurang.</li><li>Setelah <b>Terverifikasi</b>, sistem otomatis menugaskan karya ke seluruh dewan juri.</li></ol>'+

var cur=0,book=document.getElementById("book"),dots=document.getElementById("dots");
P.forEach(function(p,i){
 book.insertAdjacentHTML("beforeend",p.raw?p.h:'<section class="pg" aria-label="'+p.t+'"><div class="in"><div class="band '+p.c+'"><i>'+p.i+'</i><div>'+p.n+'</div></div>'+p.b+'</div><div class="num">'+(i+1)+'</div></section>');
 var b=document.createElement("button");b.setAttribute("aria-label","Ke halaman "+(i+1)+": "+p.t);b.onclick=function(){go(i)};dots.appendChild(b);
});
var pgs=book.children;
function go(n){cur=Math.max(0,Math.min(P.length-1,n));
 for(var i=0;i<pgs.length;i++){pgs[i].classList.toggle("gone",i<cur);pgs[i].style.zIndex=P.length-i;pgs[i].style.visibility="";pgs[i].setAttribute("aria-hidden",i!==cur)}
 [].forEach.call(dots.children,function(b,i){b.setAttribute("aria-current",i===cur)});
 document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===P.length-1;
 document.getElementById("ind").textContent="Halaman "+(cur+1)+" dari "+P.length+" · "+P[cur].t;}
document.getElementById("prev").onclick=function(){go(cur-1)};
document.getElementById("next").onclick=function(){go(cur+1)};
document.addEventListener("click",function(e){var a=e.target.closest("[data-go]");if(a){e.preventDefault();go(+a.dataset.go)}});
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
var sx=null;book.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
book.addEventListener("touchend",function(e){if(sx===null)return;var d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(cur+(d<0?1:-1));sx=null});
document.getElementById("th").onclick=function(){var r=document.documentElement,dk=matchMedia("(prefers-color-scheme:dark)").matches;var now=r.dataset.theme||(dk?"dark":"light");r.dataset.theme=now==="dark"?"light":"dark"};
go(0);
</script>
